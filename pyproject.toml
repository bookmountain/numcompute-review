[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "numcompute"
version = "0.1.0"
description = "NumPy scientific computing and buffered decision-tree streaming"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["numcompute*"]
